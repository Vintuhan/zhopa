name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Ставим совместимую с Android версию Gradle 8.6
      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      # Удаляем Windows-символы \r (CRLF) и BOM из всех конфигурационных файлов
      - name: Fix line endings and BOM
        run: |
          sudo apt-get update && sudo apt-get install -y dos2unix
          find . -type f \( -name "*.kts" -o -name "*.xml" -o -name "*.kt" -o -name "gradlew*" \) -exec dos2unix {} +

      # Запускаем сборку напрямую через установленный Gradle 8.6
      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # Сохраняем готовый APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nodep-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
